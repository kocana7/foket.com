<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 - Foket Signals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0f1629;
      --bg-card: #131c31;
      --border-color: #1e2d4a;
      --text-primary: #e8edf5;
      --text-secondary: #8fa3c0;
      --text-muted: #566a85;
      --accent-blue: #00b4d8;
      --accent-blue-dark: #0077a8;
      --accent-green: #00d084;
      --gradient-primary: linear-gradient(135deg,#00b4d8 0%,#0077a8 100%);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-xl: 24px;
      --transition: all 0.3s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;min-height:100vh}
    a{color:var(--accent-blue);text-decoration:none;transition:var(--transition)}
    a:hover{color:#48cae4}
    .navbar{background:rgba(10,14,26,0.95);border-bottom:1px solid var(--border-color);backdrop-filter:blur(20px)}
    .navbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:70px;gap:12px}
    .navbar-brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--text-primary)}
    .navbar-brand span{color:var(--accent-blue)}
    .navbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .lang-dropdown{position:relative}
    .lang-btn{display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;font-family:inherit}
    .lang-btn:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
    .lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:6px;min-width:155px;display:none;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
    .lang-menu.open{display:block}
    .lang-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);cursor:pointer;text-decoration:none}
    .lang-opt:hover{background:rgba(255,255,255,.05);color:var(--text-primary)}
    .lang-opt.cur{color:var(--accent-blue)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:var(--transition);text-decoration:none}
    .btn-outline{background:transparent;color:var(--accent-blue);border:2px solid var(--accent-blue)}
    .btn-outline:hover{background:var(--accent-blue);color:white}
    .pay-wrap{max-width:560px;margin:0 auto;padding:48px 24px 80px}
    .pay-title{font-size:28px;font-weight:800;margin-bottom:8px}
    .pay-sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px}
    .pay-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-xl);padding:32px;margin-bottom:32px}
    .pay-summary-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:16px}
    .pay-plan{font-size:22px;font-weight:700;margin-bottom:8px}
    .pay-meta{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
    .pay-total{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border-color);font-size:18px;font-weight:700}
    .pay-total .amt{font-size:28px;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
    .form-group input{width:100%;padding:14px 16px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:15px;color:var(--text-primary);transition:var(--transition);font-family:inherit}
    .form-group input:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(0,180,216,.15)}
    .form-group input::placeholder{color:var(--text-muted)}
    .pay-btn{width:100%;padding:16px;border-radius:var(--radius-md);font-size:16px;font-weight:700;background:var(--gradient-primary);color:white;border:none;cursor:pointer;transition:var(--transition);margin-top:8px;font-family:inherit}
    .pay-btn:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,180,216,.3)}
    .back-link{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);margin-bottom:24px;transition:var(--transition)}
    .back-link:hover{color:var(--accent-blue)}
    .pay-error{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:#ff4757;padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:20px;display:none}
    .pay-error.show{display:block}
  .fi{width:18px;height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15);vertical-align:-2px}</style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="images/logo.png" alt="Foket 로고" style="height:36px;width:auto;object-fit:contain;">
      </a>
      <div class="navbar-actions">
        <div class="lang-dropdown">
          <button class="lang-btn" id="langToggle"><span id="curFlag" class="fi fi-kr"></span><span id="curLang">한국어</span><span>▾</span></button>
          <div class="lang-menu" id="langMenu">
            <a class="lang-opt" data-lang="ko" href="#"><span class="fi fi-kr"></span> 한국어</a>
            <a class="lang-opt" data-lang="en" href="#"><span class="fi fi-us"></span> English</a>
            <a class="lang-opt" data-lang="de" href="#"><span class="fi fi-de"></span> Deutsch</a>
            <a class="lang-opt" data-lang="ja" href="#"><span class="fi fi-jp"></span> 日本語</a>
            <a class="lang-opt" data-lang="zh" href="#"><span class="fi fi-cn"></span> 中文</a>
            <a class="lang-opt" data-lang="fr" href="#"><span class="fi fi-fr"></span> Français</a>
            <a class="lang-opt" data-lang="es" href="#"><span class="fi fi-es"></span> Español</a>
            <a class="lang-opt" data-lang="ru" href="#"><span class="fi fi-ru"></span> Русский</a>
          </div>
        </div>
        <a href="index.html#services" class="btn btn-outline" id="navBackBtn"><i class="fas fa-arrow-left"></i> <span data-i18n="back">요금제로 돌아가기</span></a>
      </div>
    </div>
  </nav>

  <div class="pay-wrap">
    <a href="index.html#services" class="back-link"><i class="fas fa-chevron-left"></i> <span data-i18n="back">요금제로 돌아가기</span></a>
    <h1 class="pay-title" data-i18n="title">결제</h1>
    <p class="pay-sub" data-i18n="sub">선택하신 플랜으로 결제를 진행합니다.</p>

    <div id="payError" class="pay-error"></div>

    <div class="pay-card">
      <div class="pay-summary-title" data-i18n="order_summary">주문 요약</div>
      <div class="pay-plan" id="payPlanName">—</div>
      <div class="pay-meta" id="payPlanMeta"></div>
      <div class="pay-total">
        <span data-i18n="total">총 결제 금액</span>
        <span class="amt" id="payAmount">$—</span>
      </div>
    </div>

    <form id="payForm">
      <div class="form-group">
        <label for="email" data-i18n="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="name" data-i18n="name">이름</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="telegram" data-i18n="telegram">텔레그램 ID (선택)</label>
        <input type="text" id="telegram" name="telegram" placeholder="@username">
      </div>
      <button type="submit" class="pay-btn" id="payBtn"><i class="fas fa-lock"></i> <span data-i18n="pay">결제하기</span></button>
    </form>
  </div>

  <!-- ── FLOATING TELEGRAM BUTTON ── -->
  <a href="https://t.me/foketsignal_Lobby" target="_blank" rel="noopener noreferrer" style="position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;align-items:center;gap:10px;background:#229ed9;color:white;text-decoration:none;padding:14px 20px;border-radius:50px;font-size:15px;font-weight:700;box-shadow:0 4px 20px rgba(34,158,217,.5);transition:transform .2s,box-shadow .2s;white-space:nowrap;">
    <i class="fab fa-telegram-plane" style="font-size:20px;"></i>
    <span data-i18n="j">텔레그램 문의</span>
  </a>

  <script>
  (function(){
    var T = {
      ko:{title:'결제',back:'요금제로 돌아가기',sub:'선택하신 플랜으로 결제를 진행합니다.',
        order_summary:'주문 요약',period:'이용 기간: ',days:'일',total:'총 결제 금액',
        email:'이메일',name:'이름',telegram:'텔레그램 ID (선택)',pay:'결제하기',
        j:'무료 텔레그램 참여',
        no_plan:'플랜을 선택해 주세요',err_plan:'유효한 플랜이 없습니다. 요금제에서 플랜을 선택한 뒤 다시 시도해 주세요.',
        alert_ok:'결제 요청이 접수되었습니다.',alert_plan:'플랜:',alert_amt:'금액:',alert_mo:'/월',
        alert_email:'이메일:',alert_name:'이름:',alert_tg:'텔레그램:',alert_note:'실제 결제는 PG 연동 후 진행됩니다.'},
      en:{title:'Payment',back:'Back to Plans',sub:'Proceed with the selected plan.',
        order_summary:'Order Summary',period:'Usage period: ',days:' days',total:'Total Amount',
        email:'Email',name:'Name',telegram:'Telegram ID (optional)',pay:'Pay Now',
        j:'Join Free Telegram',
        no_plan:'Please select a plan',err_plan:'No valid plan selected. Please choose a plan from the pricing page.',
        alert_ok:'Payment request received.',alert_plan:'Plan:',alert_amt:'Amount:',alert_mo:'/mo',
        alert_email:'Email:',alert_name:'Name:',alert_tg:'Telegram:',alert_note:'Actual billing will be processed after PG integration.'},
      de:{title:'Zahlung',back:'Zurück zu den Tarifen',sub:'Fahren Sie mit dem ausgewählten Plan fort.',
        order_summary:'Bestellübersicht',period:'Nutzungsdauer: ',days:' Tage',total:'Gesamtbetrag',
        email:'E-Mail',name:'Name',telegram:'Telegram-ID (optional)',pay:'Jetzt bezahlen',
        j:'Kostenlos beitreten',
        no_plan:'Bitte wählen Sie einen Plan',err_plan:'Kein gültiger Plan ausgewählt. Bitte wählen Sie einen Plan von der Preisseite.',
        alert_ok:'Zahlungsanfrage erhalten.',alert_plan:'Plan:',alert_amt:'Betrag:',alert_mo:'/Mo.',
        alert_email:'E-Mail:',alert_name:'Name:',alert_tg:'Telegram:',alert_note:'Die tatsächliche Abrechnung erfolgt nach der PG-Integration.'},
      ja:{title:'お支払い',back:'料金プランに戻る',sub:'選択したプランでお支払いを進めます。',
        order_summary:'注文概要',period:'利用期間：',days:'日',total:'合計金額',
        email:'メールアドレス',name:'お名前',telegram:'Telegram ID（任意）',pay:'今すぐ支払う',
        j:'無料Telegram参加',
        no_plan:'プランを選択してください',err_plan:'有効なプランが選択されていません。料金ページからプランを選択してください。',
        alert_ok:'お支払いリクエストを受け付けました。',alert_plan:'プラン：',alert_amt:'金額：',alert_mo:'/月',
        alert_email:'メール：',alert_name:'名前：',alert_tg:'Telegram：',alert_note:'実際の請求はPG連携後に処理されます。'},
      zh:{title:'支付',back:'返回定价',sub:'按所选方案进行付款。',
        order_summary:'订单摘要',period:'使用期限：',days:'天',total:'总金额',
        email:'电子邮箱',name:'姓名',telegram:'Telegram ID（可选）',pay:'立即支付',
        j:'免费加入Telegram',
        no_plan:'请选择方案',err_plan:'没有选择有效方案，请从定价页面选择方案。',
        alert_ok:'已收到付款请求。',alert_plan:'方案：',alert_amt:'金额：',alert_mo:'/月',
        alert_email:'邮箱：',alert_name:'姓名：',alert_tg:'Telegram：',alert_note:'实际扣款将在PG集成后处理。'},
      fr:{title:'Paiement',back:'Retour aux tarifs',sub:'Procédez au paiement avec le plan sélectionné.',
        order_summary:'Récapitulatif de commande',period:'Durée d\'utilisation : ',days:' jours',total:'Montant total',
        email:'E-mail',name:'Nom',telegram:'ID Telegram (facultatif)',pay:'Payer maintenant',
        j:'Rejoindre Telegram gratuitement',
        no_plan:'Veuillez sélectionner un plan',err_plan:'Aucun plan valide sélectionné. Veuillez choisir un plan sur la page de tarification.',
        alert_ok:'Demande de paiement reçue.',alert_plan:'Plan :',alert_amt:'Montant :',alert_mo:'/mois',
        alert_email:'E-mail :',alert_name:'Nom :',alert_tg:'Telegram :',alert_note:'La facturation réelle sera traitée après l\'intégration PG.'},
      es:{title:'Pago',back:'Volver a los planes',sub:'Procede con el plan seleccionado.',
        order_summary:'Resumen del pedido',period:'Período de uso: ',days:' días',total:'Importe total',
        email:'Correo electrónico',name:'Nombre',telegram:'ID de Telegram (opcional)',pay:'Pagar ahora',
        j:'Unirse gratis a Telegram',
        no_plan:'Por favor selecciona un plan',err_plan:'No hay plan válido seleccionado. Por favor elige un plan en la página de precios.',
        alert_ok:'Solicitud de pago recibida.',alert_plan:'Plan:',alert_amt:'Importe:',alert_mo:'/mes',
        alert_email:'Correo:',alert_name:'Nombre:',alert_tg:'Telegram:',alert_note:'La facturación real se procesará tras la integración con el PG.'},
      ru:{title:'Оплата',back:'Назад к тарифам',sub:'Перейдите к оплате выбранного плана.',
        order_summary:'Сводка заказа',period:'Срок использования: ',days:' дней',total:'Итоговая сумма',
        email:'Эл. почта',name:'Имя',telegram:'Telegram ID (необязательно)',pay:'Оплатить сейчас',
        j:'Присоединиться к Telegram бесплатно',
        no_plan:'Пожалуйста, выберите план',err_plan:'Действительный план не выбран. Пожалуйста, выберите план на странице тарифов.',
        alert_ok:'Запрос на оплату получен.',alert_plan:'План:',alert_amt:'Сумма:',alert_mo:'/мес.',
        alert_email:'Почта:',alert_name:'Имя:',alert_tg:'Telegram:',alert_note:'Фактическое списание средств будет произведено после интеграции с PG.'}
    };
    var LANG_META = {ko:{flag: 'fi-kr',name:'한국어'},en:{flag: 'fi-us',name:'English'},de:{flag: 'fi-de',name:'Deutsch'},ja:{flag: 'fi-jp',name:'日本語'},zh:{flag: 'fi-cn',name:'中文'},fr:{flag: 'fi-fr',name:'Français'},es:{flag: 'fi-es',name:'Español'},ru:{flag: 'fi-ru',name:'Русский'}};
    var currentLang = localStorage.getItem('lang') || 'ko';

    var PLANS_DEFAULT = {
      bronze:{name:'Bronze Class',price:30,days:30},
      silver:{name:'Silver Class',price:45,days:30},
      gold:{name:'Gold Class',price:60,days:30},
      vip:{name:'VIP Class',price:80,days:30}
    };
    var PLANS = PLANS_DEFAULT;

    function parsePlans(raw) {
      try {
        var arr = JSON.parse(raw);
        var map = {};
        arr.forEach(function(p){ if(p.slug) map[p.slug]={name:p.name,price:p.price,days:p.days}; });
        if(Object.keys(map).length) return map;
      } catch(e){}
      return null;
    }
    try { var r = localStorage.getItem('fk_plans'); if(r){ var m = parsePlans(r); if(m) PLANS = m; } } catch(e){}

    var params = new URLSearchParams(location.search);
    var planId = (params.get('plan') || '').toLowerCase();

    function applyLang(lang) {
      if (!T[lang]) lang = 'ko';
      currentLang = lang;
      var t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.title + ' - Foket Signals';
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var k = el.getAttribute('data-i18n');
        if (t[k] !== undefined) el.textContent = t[k];
      });
      var meta = LANG_META[lang];
      document.getElementById('curFlag').className = 'fi ' + meta.flag;
      document.getElementById('curLang').textContent = meta.name;
      document.querySelectorAll('.lang-opt').forEach(function(opt){ opt.classList.toggle('cur', opt.dataset.lang === lang); });
      applyPlan(PLANS);
    }

    function applyPlan(plans) {
      var t = T[currentLang] || T['ko'];
      var plan = plans[planId];
      var payError = document.getElementById('payError');
      if (plan) {
        document.getElementById('payPlanName').textContent = plan.name;
        document.getElementById('payAmount').textContent = '$' + plan.price;
        document.getElementById('payPlanMeta').textContent = t.period + (plan.days || 30) + t.days;
        document.title = plan.name + ' - ' + t.title + ' - Foket Signals';
        payError.classList.remove('show');
      } else {
        document.getElementById('payPlanName').textContent = t.no_plan;
        document.getElementById('payAmount').textContent = '$—';
        document.getElementById('payPlanMeta').textContent = '';
        payError.textContent = t.err_plan;
        payError.classList.add('show');
      }
    }

    applyLang(currentLang);

    document.getElementById('langToggle').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('langMenu').classList.toggle('open'); });
    document.addEventListener('click', function(){ document.getElementById('langMenu').classList.remove('open'); });
    document.querySelectorAll('.lang-opt').forEach(function(opt){
      opt.addEventListener('click', function(e){
        e.preventDefault();
        currentLang = opt.dataset.lang;
        localStorage.setItem('lang', currentLang);
        document.getElementById('langMenu').classList.remove('open');
        applyLang(currentLang);
      });
    });

    (async function() {
      try {
        var base = (location.protocol !== 'file:') ? location.origin + '/api' : 'http://localhost:3000/api';
        var res = await fetch(base + '/storage/plans', {cache:'no-store'});
        var j = await res.json();
        if (j && j.success && j.value) {
          try { localStorage.setItem('fk_plans', j.value); } catch(e){}
          var m = parsePlans(j.value);
          if (m) { PLANS = m; applyPlan(PLANS); }
        }
      } catch(e){}
    })();

    document.getElementById('payForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var plan = PLANS[planId];
      if (!plan) return;
      var t = T[currentLang] || T['ko'];
      var email = document.getElementById('email').value.trim();
      var name = document.getElementById('name').value.trim();
      var telegram = document.getElementById('telegram').value.trim();
      var msg = t.alert_ok + '\n\n' + t.alert_plan + ' ' + plan.name + '\n' + t.alert_amt + ' $' + plan.price + t.alert_mo + '\n' + t.alert_email + ' ' + email + '\n' + t.alert_name + ' ' + name + (telegram ? '\n' + t.alert_tg + ' ' + telegram : '') + '\n\n' + t.alert_note;
      alert(msg);
    });
  })();
  </script>

</body>
</html>
