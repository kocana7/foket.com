name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.212.176.114 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@34.212.176.114 'set -e
          cd /var/www/foket
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npm install --production
          echo "DB_HOST=localhost" > .env
          echo "DB_PORT=3306" >> .env
          echo "DB_USER=foket_user" >> .env
          echo "DB_PASSWORD=Foket@DB2024!" >> .env
          echo "DB_NAME=foket_db" >> .env
          echo "SESSION_SECRET=foket-super-secret-key-2024" >> .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=production" >> .env
          echo "BASE_URL=https://foket.com" >> .env
          echo "ADMIN_EMAIL=admin@foket.com" >> .env
          echo "ADMIN_PASSWORD=Admin@123" >> .env
          echo "ADMIN_PANEL_PASSWORD=Admin@123" >> .env
          echo "GOOGLE_CLIENT_ID=" >> .env
          echo "GOOGLE_CLIENT_SECRET=" >> .env
          pm2 describe foket > /dev/null 2>&1 && pm2 restart foket --update-env || pm2 start ecosystem.config.js --env production
          pm2 save

          # ── Nginx 설정 ──────────────────────────────────────────
          sudo rm -f /etc/nginx/sites-enabled/default

          # certbot 설치
          if ! command -v certbot > /dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y certbot python3-certbot-nginx
          fi

          # SSL 인증서 발급 (최초 1회)
          if [ ! -f /etc/letsencrypt/live/foket.com/fullchain.pem ]; then
            sudo cp /var/www/foket/scripts/nginx-foket.conf /etc/nginx/sites-enabled/foket
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot certonly --nginx -d foket.com -d www.foket.com --non-interactive --agree-tos --email kocana7@gmail.com
          fi

          # 인증서 유무에 따라 nginx 설정 선택
          if [ -f /etc/letsencrypt/live/foket.com/fullchain.pem ]; then
            sudo cp /var/www/foket/scripts/nginx-foket-ssl.conf /etc/nginx/sites-enabled/foket
          else
            sudo cp /var/www/foket/scripts/nginx-foket.conf /etc/nginx/sites-enabled/foket
          fi
          sudo nginx -t && sudo systemctl reload nginx'
