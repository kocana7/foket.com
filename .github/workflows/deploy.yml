name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/foket
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install --production
            if [ ! -f .env ]; then
              echo "NODE_ENV=production" >> .env
              echo "PORT=3000" >> .env
            fi
            pm2 describe foket > /dev/null 2>&1 && pm2 restart foket || pm2 start ecosystem.config.js --env production
            pm2 save
          ENDSSH
