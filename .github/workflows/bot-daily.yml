name: Bot daily results

# 봇이 엑셀 신호 기록으로 집계한 데일리 2종목 하루 실적을 trades.csv 줄 모양으로 출력합니다 (읽기 전용).
# 하루 마감은 다음 날 아침 06:50 (KST). day 를 비우면 가장 최근에 마감된 날.
# 출력 줄:  ROW,date,sym,name,side,entry,exit,pnl,min_pnl,cur,kind,samples,max_gap_sec,first_at,last_at
on:
  workflow_dispatch:
    inputs:
      day:
        description: "YYYY-MM-DD (비우면 가장 최근 마감일)"
        required: false
        default: ""

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Read daily results
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          case "$DAY" in ""|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "day 형식 오류"; exit 1;; esac
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -q -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o LogLevel=ERROR ubuntu@34.212.176.114 "DAY='$DAY' bash -s" <<'REMOTE'
          sudo DAY="$DAY" /opt/foket-bot/venv/bin/python - <<'PY'
          import os, sqlite3, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          day = os.environ.get("DAY") or (now - dt.timedelta(days=1) if now.time() >= dt.time(6, 50)
                                          else now - dt.timedelta(days=2)).date().isoformat()
          c = sqlite3.connect("/opt/foket-bot/foket_bot.db")
          c.row_factory = sqlite3.Row
          try:
              rows = c.execute("SELECT * FROM daystats WHERE day=? ORDER BY code<>'K200', samples DESC", (day,)).fetchall()
          except sqlite3.OperationalError:
              rows = []
          print("DAY", day, "rows", len(rows))
          for r in rows:
              cur = "KRW" if r["code"] == "K200" else "USD"
              print(",".join(str(x) for x in ["ROW", day, r["code"], r["name"], "", "", "", round(r["total"]),
                                              round(r["min_total"]), cur, "live", r["samples"], r["max_gap"],
                                              r["first_at"], r["last_at"]]))
          PY
          REMOTE
