name: Bot status

# 포켓 텔레그램 봇 상태 확인 (읽기 전용). 엑셀에서 표가 들어오는지, 회원 수 등을 봅니다.
# 공개 저장소라 토큰·IP·회원 정보는 출력하지 않습니다.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@34.212.176.114 'bash -s' <<'REMOTE'
          echo "== 서비스 =="; systemctl is-active foket-bot; systemctl show foket-bot -p ActiveEnterTimestamp
          echo "== 서버 안 health =="; curl -s -m 5 http://127.0.0.1:8091/health; echo
          echo "== https://foket.com/bot-api/health =="; curl -s -m 5 -o /dev/null -w "%{http_code}\n" https://foket.com/bot-api/health
          echo "== 엑셀에서 들어온 요청 (최근 10건, 시각·주소·결과만) =="
          sudo grep -h "/bot-api/" /var/log/nginx/access.log 2>/dev/null | tail -n 10 | awk '{print $4, $6, $7, $9}'
          echo "== 봇 DB =="
          sudo /opt/foket-bot/venv/bin/python - <<'PY'
          import sqlite3, json
          c = sqlite3.connect("/opt/foket-bot/foket_bot.db")
          q = lambda s: c.execute(s).fetchall()
          print("종목 표:", q("SELECT COUNT(*), MAX(at) FROM positions")[0])
          for code, data, daily in q("SELECT code, data, daily FROM positions ORDER BY rowid"):
              d = json.loads(data); print(" ", code, d[1] if len(d) > 1 else "", "| 포지션:", d[2] if len(d) > 2 else "", "| 데일리" if daily else "")
          print("회원 상태:", q("SELECT status, COUNT(*) FROM users GROUP BY status"))
          print("신호 발송 (최근 5):", q("SELECT at, service, sent FROM signals ORDER BY id DESC LIMIT 5"))
          PY
          REMOTE
